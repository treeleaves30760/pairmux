<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pairmux promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root {
  --bg-0:#0a1113; --bg-1:#0f191c; --bg-2:#152226; --line:#223338; --line-strong:#2f454b;
  --term-bg:#0b1517; --term-chrome:#121d20;
  --fg-0:#eaf2f1; --fg-1:#c7d6d4; --fg-2:#8aa0a0;
  --agent:#2dd4bf; --agent-soft:rgb(45 212 191 / 12%); --agent-line:rgb(45 212 191 / 45%);
  --human:#f5b544; --human-soft:rgb(245 181 68 / 12%); --human-line:rgb(245 181 68 / 55%);
  --dead:#ff6b6b; --idle:#87afff;
  --display:'Bricolage Grotesque','Noto Sans TC',system-ui,sans-serif;
  --body:'Inter','Noto Sans TC',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,'Noto Sans TC',monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg-0); }
body {
  width:100vw; height:100vh; overflow:hidden; color:var(--fg-1); font-family:var(--body);
  background:
    radial-gradient(900px 520px at 8% -10%, rgb(45 212 191 / 13%), transparent 60%),
    radial-gradient(800px 520px at 105% 110%, rgb(245 181 68 / 10%), transparent 60%),
    linear-gradient(var(--bg-0), var(--bg-0));
}
body::before { /* faint terminal grid */
  content:""; position:fixed; inset:0; pointer-events:none;
  background-image:linear-gradient(rgb(255 255 255 / 2.2%) 1px, transparent 1px),
                   linear-gradient(90deg, rgb(255 255 255 / 2.2%) 1px, transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse at 40% 40%, #000 30%, transparent 85%);
}
.page { position:relative; height:100%; padding:52px 60px; display:grid; gap:28px; }

/* brand row */
.brand { display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:14px; font:800 30px/1 var(--display); color:var(--fg-0); letter-spacing:-.01em; }
.logo svg { width:46px; height:46px; }
.site { font:500 17px var(--mono); color:var(--fg-2); }
.ver { font:600 13px var(--mono); color:var(--agent); border:1px solid var(--agent-line); background:var(--agent-soft);
  padding:4px 10px; border-radius:999px; margin-left:6px; letter-spacing:.02em; }

h1 { font:800 60px/1.03 var(--display); color:var(--fg-0); letter-spacing:-.025em; }
h1 .a { color:var(--agent); } h1 .h { color:var(--human); }
.sub { font:400 21px/1.5 var(--body); color:var(--fg-1); max-width:30em; }
.sub b { color:var(--fg-0); font-weight:600; }

/* terminal cards */
.term { background:var(--term-bg); border:1px solid var(--line-strong); border-radius:14px; overflow:hidden;
  box-shadow:0 24px 60px rgb(0 0 0 / 45%); }
.term.agent { border-color:var(--agent-line); }
.term.human { border-color:var(--human-line); }
.bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 18px;
  background:var(--term-chrome); border-bottom:1px solid var(--line); font:600 12.5px var(--mono);
  letter-spacing:.08em; text-transform:uppercase; color:var(--fg-2); white-space:nowrap; }
.bar .st { display:flex; align-items:center; gap:8px; }
.bar .st::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
.bar .st.a { color:var(--agent); } .bar .st.h { color:var(--human); }
.scr { padding:16px 20px; font:400 16px/1.75 var(--mono); color:var(--fg-1); white-space:pre; }
.p { color:var(--fg-2); } .a { color:var(--agent); } .h { color:var(--human); } .m { color:var(--fg-2); }
.i { color:var(--idle); } .w { color:var(--fg-0); font-weight:600; }
.cur { display:inline-block; width:.6em; height:1.1em; background:var(--human); vertical-align:-.2em; }
.tag { font-size:13px; padding:1px 8px; border-radius:5px; border:1px solid var(--human-line); background:var(--human-soft); color:var(--human); }

/* chips & install */
.chips { display:flex; flex-wrap:wrap; gap:10px; }
.chip { font:500 15px var(--body); color:var(--fg-1); background:var(--bg-2); border:1px solid var(--line);
  padding:8px 14px; border-radius:999px; white-space:nowrap; }
.chip b { color:var(--agent); font-weight:600; }
.chip.hu b { color:var(--human); }
.install { display:inline-flex; align-items:center; gap:14px; font:600 19px var(--mono); color:var(--fg-0);
  background:var(--bg-1); border:1px solid var(--agent-line); padding:13px 20px; border-radius:12px; white-space:nowrap; }
.install .p { font-weight:400; }
.install .alt { font:400 15px var(--mono); color:var(--fg-2); }
.flow { display:flex; gap:22px; font:600 14px var(--mono); color:var(--fg-2); letter-spacing:.04em; }
.flow span b { font-weight:700; }

/* ---------- layouts ---------- */
.L, .P, .O { display:none; }
body.land .L, body.port .P, body.og .O { display:grid; }

/* land 1200x675 (X / LinkedIn) */
body.land .page { grid-template-rows:auto 1fr auto; padding:44px 54px 40px; gap:22px; }
body.land .mid { display:grid; grid-template-columns:1.02fr 1fr; gap:34px; align-items:center; }
body.land .left { display:grid; gap:22px; align-content:center; }
body.land h1 { font-size:58px; }
body.land .sub { font-size:19px; }
body.land .scr { font-size:14.5px; padding:14px 18px; }
body.land .stack { display:grid; gap:16px; }
body.land .foot { display:flex; justify-content:space-between; align-items:center; }

/* port 1080x1350 (Threads / IG) */
body.port .page.P { display:flex; flex-direction:column; padding:54px 64px 52px; gap:24px; }
body.port h1 { font-size:68px; }
body.port .sub { font-size:22px; }
body.port .scr { font-size:16px; line-height:1.65; }
body.port .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
body.port .tile { background:var(--bg-1); border:1px solid var(--line); border-radius:14px; padding:15px 20px; }
body.port .tile h3 { font:700 20px var(--display); color:var(--fg-0); margin-bottom:6px; }
body.port .tile h3 .h { color:var(--human); } body.port .tile h3 .a { color:var(--agent); }
body.port .tile p { font:400 16px/1.45 var(--body); color:var(--fg-2); }
body.port .tile code { font:500 14.5px var(--mono); color:var(--fg-1); }
body.port .foot { display:flex; justify-content:space-between; align-items:center; margin-top:auto; }

/* og 1280x640 (README banner / social preview) */
body.og .page { grid-template-columns:1.08fr 1fr; grid-template-rows:auto 1fr; gap:22px 40px; padding:46px 56px; }
body.og .brand { grid-column:1 / -1; }
body.og .left { display:grid; gap:22px; align-content:center; }
body.og h1 { font-size:60px; }
body.og .sub { font-size:19px; }
body.og .right { display:grid; gap:16px; align-content:center; }
body.og .scr { font-size:14.5px; padding:14px 18px; }
.sub code { font:600 .92em var(--mono); color:var(--fg-0); }
.tile code { font:500 .92em var(--mono); color:var(--fg-1); }
html[lang=zh-Hant] h1 { letter-spacing:.01em; line-height:1.12; font-weight:900; }
html[lang=zh-Hant] .bar { letter-spacing:.06em; }
html[lang=zh-Hant] .sub, html[lang=zh-Hant] .tile p { line-height:1.6; }
</style>
</head>
<body>
<template id="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0f191c" stroke="#223338"/><path d="m7 10 5 6-5 6m18-12-5 6 5 6M16 7v18" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></template>

<template id="tree"><div class="term agent">
  <div class="bar"><span data-t="card_tree_title"></span><span class="st a" data-t="card_tree_status"></span></div>
<div class="scr"><span class="w">lead</span>          <span class="m">claude</span>   <span class="a">● running</span>
├─ <span class="w">api</span>        <span class="m">codex</span>    <span class="a">● running</span>
│  ├─ <span class="w">tests</span>   <span class="m">pytest</span>   <span class="i">○ idle</span>
│  └─ <span class="w">lint</span>    <span class="m">ruff</span>     <span class="i">○ idle</span>
└─ <span class="w">web</span>        <span class="m">claude</span>   <span class="h">◆ needs input</span></div>
</div></template>

<template id="handoff"><div class="term human">
  <div class="bar"><span>deploy — pairmux</span><span class="st h" data-t="card_handoff_status"></span></div>
<div class="scr"><span class="p">$</span> ssh deploy@staging.internal
deploy@staging.internal's password: <span class="cur"></span>
<span class="m">agent:</span> <span class="a">wait --human --notify</span>  <span class="m">you:</span> <span class="h">attach deploy</span></div>
</div></template>

<template id="brand"><div class="brand">
  <div class="logo"><slot-logo></slot-logo>pairmux<span class="ver">v1.7</span></div>
  <div class="site">pairmux.treeleaves30760.com</div>
</div></template>

<template id="h1"><h1 data-t="headline"></h1></template>
<template id="install"><span class="install"><span class="p">$</span> uv tool install pairmux</span></template>

<!-- land -->
<div class="page L">
  <div data-use="brand"></div>
  <div class="mid">
    <div class="left">
      <div data-use="h1"></div>
      <p class="sub" data-t="sub_land"></p>
      <div class="chips" data-t="chips"></div>
    </div>
    <div class="stack"><div data-use="tree"></div><div data-use="handoff"></div></div>
  </div>
  <div class="foot">
    <div data-use="install"></div>
    <span class="flow" data-t="footer"></span>
  </div>
</div>

<!-- port -->
<div class="page P">
  <div data-use="brand"></div>
  <div data-use="h1"></div>
  <p class="sub" data-t="sub_port"></p>
  <div data-use="tree"></div>
  <div data-use="handoff"></div>
  <div class="grid4" data-t="tiles"></div>
  <div class="foot">
    <div data-use="install"></div>
    <span class="flow"><span>github.com/treeleaves30760/pairmux</span></span>
  </div>
</div>

<!-- og / README banner -->
<div class="page O">
  <div data-use="brand"></div>
  <div class="left">
    <div data-use="h1"></div>
    <p class="sub" data-t="sub_banner"></p>
    <div><div data-use="install"></div></div>
  </div>
  <div class="right"><div data-use="tree"></div><div data-use="handoff"></div></div>
</div>

<script>
/* Copy lives in COPY.en / COPY.zh. In strings, *word* is highlighted and `code` is code. */
const COPY = /*COPY*/{
 "en": {
  "headline": [
   "Your *agent* drives",
   "the terminal.",
   "*You* take over",
   "when it matters."
  ],
  "sub_land": "A real terminal for AI coding agents: `python`, `vim`, ssh/sudo prompts, `git rebase -i`. Agents can launch sub-agents, and you can `attach` to any of them.",
  "sub_port": "A real terminal for AI coding agents. You watch the same screen live and can take over anytime.",
  "sub_banner": "A real terminal, human takeover and agent trees for Claude Code, Codex and any CLI agent.",
  "chips": [
   "real terminal",
   "you can take over",
   "agent trees",
   "macOS/Linux/Windows"
  ],
  "tiles": [
   {
    "title": "*Real* terminal",
    "body": "`python`, `psql`, `vim`, pagers, `[y/N]`: stuff a plain exec shell can't run."
   },
   {
    "title": "*Human* handoff",
    "body": "Passwords and judgment calls go to you. `attach`, answer, hand back."
   },
   {
    "title": "*Agent* trees",
    "body": "Claude Code, Codex, agy as sub-agents. Orders go down, reports come up."
   },
   {
    "title": "Runs *anywhere*",
    "body": "Works with tmux or its own built-in one. macOS, Linux, native Windows."
   }
  ],
  "footer": [
   "*agent* drives",
   "*human* decides",
   "tmux optional"
  ],
  "card_tree_title": "pairmux tui · agent tree",
  "card_tree_status": "orders ↓ reports ↑",
  "card_handoff_status": "awaiting-input · secret"
 },
 "zh": {
  "headline": [
   "*agent* 來操作",
   "真正的終端機",
   "*你*隨時能接手",
   "密碼不給它看"
  ],
  "sub_land": "給 coding agent 真的終端機：`python`、`vim`、ssh 密碼、`git rebase -i`。你能 `attach` 接手。",
  "sub_port": "給 AI agent 真的終端機。你看同一個畫面，隨時能接手。",
  "sub_banner": "給 Claude Code、Codex 等 agent 真終端機，能接手、能分工。",
  "chips": [
   "真的終端機",
   "人隨時接手",
   "agent 協作",
   "三平台都能用"
  ],
  "tiles": [
   {
    "title": "*真的*終端機",
    "body": "`python`、`psql`、`vim`、`[y/N]` 都能互動。"
   },
   {
    "title": "*人*隨時接手",
    "body": "密碼、要拍板的事交給你。`attach` 進去處理，再交還。"
   },
   {
    "title": "*Agent* 樹",
    "body": "Claude Code、Codex、agy 當下屬，指令下、回報上。"
   },
   {
    "title": "*哪都*能跑",
    "body": "tmux 或內建的都行。macOS、Linux、原生 Windows。"
   }
  ],
  "footer": [
   "*agent* 操作",
   "*你*拍板",
   "tmux 可選"
  ],
  "card_tree_title": "agent 樹狀圖",
  "card_tree_status": "指令↓ 回報↑",
  "card_handoff_status": "等你輸入 · 密碼"
 }
}/*END*/;
const [mode, lang] = (location.hash || '#land').slice(1).split('-');
document.body.className = mode;
const L = COPY[lang === 'zh' ? 'zh' : 'en'];
document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = (t, hl = 'a') => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*]+)\*/g,`<span class="${hl}">$1</span>`);
const logo = document.getElementById('logo').innerHTML;
document.querySelectorAll('[data-use]').forEach(el => {
  el.outerHTML = document.getElementById(el.dataset.use).innerHTML.replace('<slot-logo></slot-logo>', logo);
});
const icons = [['','●'],['hu','◆'],['','├'],['','⧉']];
const render = {
  headline: v => v.map((l, i) => fmt(l, i < 2 ? 'a' : 'h')).join('<br>'),
  chips: v => v.map((c, i) => `<span class="chip ${icons[i][0]}"><b>${icons[i][1]}</b> ${fmt(c)}</span>`).join(''),
  footer: v => v.map((f, i) => `<span>${fmt(f, i === 1 ? 'h' : 'a')}</span>`).join(''),
  tiles: v => v.map((t, i) => `<div class="tile"><h3>${fmt(t.title, i === 1 ? 'h' : 'a')}</h3><p>${fmt(t.body)}</p></div>`).join(''),
};
document.querySelectorAll('[data-t]').forEach(el => {
  const k = el.dataset.t, v = L[k];
  el.innerHTML = render[k] ? render[k](v) : fmt(v);
});
</script>
</body>
</html>
