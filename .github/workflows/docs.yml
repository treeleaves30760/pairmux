name: Docs

# Builds the Docusaurus site in website/ and deploys it to GitHub Pages.
# Runs only when documentation actually changes.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'ChangeLog.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent Pages deployment; do not cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Not `npm audit --audit-level=moderate`: that gate went red on an
      # advisory with no published fix, and since it runs before the build it
      # took every documentation deploy down with it. `npm run audit` fails the
      # same way on anything actionable, but accepts a short list of reviewed
      # exceptions and re-checks on every run that they are still unfixable.
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run build
      # Docusaurus emits the static site to website/build by default.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
