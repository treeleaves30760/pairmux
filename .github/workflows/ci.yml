name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Self-test commit subject validator
        run: ./scripts/validate-commit-subjects.sh --self-test
      - name: Validate new commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./scripts/validate-commit-subjects.sh --branch "$PR_HEAD_REF"
            ./scripts/validate-commit-subjects.sh --range "$BASE_SHA" "$PR_HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ./scripts/validate-commit-subjects.sh --range "$BEFORE_SHA" "$HEAD_SHA"
          else
            ./scripts/validate-commit-subjects.sh --commit "$HEAD_SHA"
          fi

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint workflows and release scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          shellcheck install.sh scripts/*.sh
          ./scripts/test-install.sh

      - name: Lint the Windows installer
        shell: pwsh
        run: |
          # install.ps1 is normally run as `irm ... | iex`, so a syntax error in
          # it is a syntax error in someone's terminal. Parse it and analyse it
          # here; the ubuntu runner ships pwsh already.
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object {
              Write-Host "install.ps1:$($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          # PSAvoidUsingWriteHost is excluded on purpose: for an installer run
          # through a pipe, the console is the output (see install.ps1).
          $findings = Invoke-ScriptAnalyzer -Path "$PWD/install.ps1" `
            -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String -Width 160 | Write-Host
            exit 1
          }
          Write-Host "install.ps1 parses clean with no analyzer findings"

  # Fast feedback: static analysis + unit tests, no tmux required.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Test release packaging
        run: python3 -m unittest discover -s packaging/pypi -p 'test_*.py'

  # tmux-backed suite behind the `integration` build tag.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
      - run: tmux -V
      - run: go test -race -tags integration -count=1 ./test/...
