name: Tap credential

# The Homebrew tap token is the one release credential that cannot be checked
# from a developer machine — only Actions can read the secret — and the release
# job reaches it after PyPI, which is not republishable for a tag. So it gets a
# manual check to run after every rotation, before the next tag exists.
#
# Unlike the release preflight (a read, so it adds nothing to the tap) this
# proves the write the release actually performs, then removes the scratch file
# it wrote. It never touches Casks/.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tap-credential
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      TAP_REPO: treeleaves30760/homebrew-pairmux
      PROBE: .release-token-check
    steps:
      - name: Check the tap token can read the cask
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN" || {
            echo "HOMEBREW_TAP_GITHUB_TOKEN is empty or unset" >&2
            exit 1
          }
          GH_TOKEN="$TAP_TOKEN" gh api \
            "repos/$TAP_REPO/contents/Casks/pairmux.rb" --jq .sha >/dev/null || {
            echo "cannot read Casks/pairmux.rb in $TAP_REPO." >&2
            echo "A 403 means the token is valid but lacks access: check that its" >&2
            echo "fine-grained PAT selects that repository and grants Contents." >&2
            exit 1
          }
          echo "read ok"

      - name: Check the tap token can write, then clean up after itself
        run: |
          set -euo pipefail
          sha=$(
            GH_TOKEN="$TAP_TOKEN" gh api --method PUT \
              "repos/$TAP_REPO/contents/$PROBE" \
              -f message='chore: verify-release-token' \
              -f content="$(printf ok | base64)" \
              --jq .content.sha
          ) || {
            echo "read succeeded but write did not: the token most likely grants" >&2
            echo "Contents: Read rather than Contents: Read and write." >&2
            exit 1
          }
          echo "write ok"
          # Removing the probe matters more than the check passing: a leftover
          # file in the tap root outlives this run and every later one.
          GH_TOKEN="$TAP_TOKEN" gh api --method DELETE \
            "repos/$TAP_REPO/contents/$PROBE" \
            -f message='chore: drop-release-token-check' -f sha="$sha" --jq .commit.sha >/dev/null
          echo "probe removed"

      - name: Fail loudly if the probe survived
        if: always()
        run: |
          set -euo pipefail
          if GH_TOKEN="$TAP_TOKEN" gh api "repos/$TAP_REPO/contents/$PROBE" --jq .sha >/dev/null 2>&1; then
            echo "$PROBE is still present in $TAP_REPO — delete it by hand" >&2
            exit 1
          fi
          echo "tap is clean"
